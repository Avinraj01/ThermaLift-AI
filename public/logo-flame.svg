<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4800" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFC300" />
    </linearGradient>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Derrick Structure -->
  <path d="M25 90 L45 25 L55 25 L75 90 Z" stroke="#3A506B" stroke-width="3" fill="none"/>
  <line x1="30" y1="70" x2="70" y2="70" stroke="#3A506B" stroke-width="2"/>
  <line x1="35" y1="52" x2="65" y2="52" stroke="#3A506B" stroke-width="2"/>
  <line x1="40" y1="36" x2="60" y2="36" stroke="#3A506B" stroke-width="2"/>
  <line x1="30" y1="70" x2="65" y2="52" stroke="#233566" stroke-width="1.5"/>
  <line x1="70" y1="70" x2="35" y2="52" stroke="#233566" stroke-width="1.5"/>
  <line x1="35" y1="52" x2="60" y2="36" stroke="#233566" stroke-width="1.5"/>
  <line x1="65" y1="52" x2="40" y2="36" stroke="#233566" stroke-width="1.5"/>
  <!-- Thermal Flame Core -->
  <path d="M50 12 C44 24 38 34 38 48 C38 60 44 68 50 68 C56 68 62 60 62 48 C62 34 56 24 50 12 Z" fill="url(#flameGrad)" filter="url(#glow)"/>
  <path d="M50 28 C47 36 43 43 43 51 C43 57 46 62 50 62 C54 62 57 57 57 51 C57 43 53 36 50 28 Z" fill="#FFEAA7"/>
  <!-- Subsurface wave indicator -->
  <path d="M15 90 Q 50 82, 85 90" stroke="url(#cyberGrad)" stroke-width="3" stroke-linecap="round"/>
</svg>
